<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chitchatars - Login</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>

    <div id="app-container">
        <div class="login-box">
            <h2>Join chitchatars</h2>
            
            <div class="input-group">
                <label>Username or ID</label>
                <input type="text" id="username" placeholder="Enter your username">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            <div class="avatar-section">
                <p>Choose your Avatar:</p>
                <div class="avatar-grid">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Max" class="avatar" id="avatar1" onclick="selectAvatar('avatar1')">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Mia" class="avatar" id="avatar2" onclick="selectAvatar('avatar2')">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Leo" class="avatar" id="avatar3" onclick="selectAvatar('avatar3')">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Zoe" class="avatar" id="avatar4" onclick="selectAvatar('avatar4')">
                </div>
            </div>

            <button id="login-btn" onclick="startChat()">Enter Chat</button>
        </div>
    </div>

    <script>
        let chosenAvatarId = "";

        function selectAvatar(avatarId) {
            let allAvatars = document.querySelectorAll('.avatar');
            allAvatars.forEach(function(av) {
                av.classList.remove('selected');
            });

            document.getElementById(avatarId).classList.add('selected');
            chosenAvatarId = avatarId;
        }

        function startChat() {
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;

            if (user === "" || pass === "") {
                alert("Hold on! Please enter both a username and password.");
                return;
            }

            if (chosenAvatarId === "") {
                alert("Don't forget to choose an avatar!");
                return;
            }

            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
