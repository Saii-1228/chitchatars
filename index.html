<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chitchatars - Welcome</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>

    <div id="app-container">
        <div class="login-box">
            <!-- Updated Welcome Message -->
            <h2>Welcome to chitchatars<br><span class="subtitle">Made by Ojha</span></h2>
            
            <!-- Login / Sign Up Toggle Switch -->
            <div class="auth-toggle">
                <button id="toggle-signup" class="active" onclick="switchTab('signup')">Sign Up (New ID)</button>
                <button id="toggle-login" onclick="switchTab('login')">Login (Existing)</button>
            </div>

            <div class="input-group">
                <label id="username-label">Create a New Username or ID</label>
                <input type="text" id="username" placeholder="Enter your ID">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            <div class="avatar-section">
                <p>Choose your Avatar:</p>
                <div class="avatar-grid">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Max" class="avatar" id="avatar1" onclick="selectAvatar('avatar1')">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Mia" class="avatar" id="avatar2" onclick="selectAvatar('avatar2')">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Leo" class="avatar" id="avatar3" onclick="selectAvatar('avatar3')">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Zoe" class="avatar" id="avatar4" onclick="selectAvatar('avatar4')">
                </div>
            </div>

            <!-- Updated Final Button -->
            <button id="action-btn" class="login-btn" onclick="startChat()">Create ID & Enter Public Chat</button>
        </div>
    </div>

    <script>
        let chosenAvatarId = "";

        // Avatar Selection Logic
        function selectAvatar(avatarId) {
            let allAvatars = document.querySelectorAll('.avatar');
            allAvatars.forEach(function(av) {
                av.classList.remove('selected');
            });

            document.getElementById(avatarId).classList.add('selected');
            chosenAvatarId = avatarId;
        }

        // Tab Switching Logic (Sign Up vs Login)
        function switchTab(tab) {
            let loginBtn = document.getElementById('toggle-login');
            let signupBtn = document.getElementById('toggle-signup');
            let actionBtn = document.getElementById('action-btn');
            let userLabel = document.getElementById('username-label');

            if (tab === 'login') {
                loginBtn.classList.add('active');
                signupBtn.classList.remove('active');
                actionBtn.innerText = "Enter Public Chat";
                userLabel.innerText = "Existing Username or ID";
            } else {
                signupBtn.classList.add('active');
                loginBtn.classList.remove('active');
                actionBtn.innerText = "Create ID & Enter Public Chat";
                userLabel.innerText = "Create a New Username or ID";
            }
        }

        // Enter Chat Logic
        function startChat() {
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;

            if (user === "" || pass === "") {
                alert("Hold on! Please enter your details.");
                return;
            }

            if (chosenAvatarId === "") {
                alert("Don't forget to choose an avatar!");
                return;
            }

            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
